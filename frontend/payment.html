<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <title>GoConnectMarketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="..." crossorigin="anonymous"></script>

  <script defer src="payment.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.15.2/dist/cdn.min.js"></script>
</head>
<body>
    <div 
        class="container d-flex justify-content-center align-items-center min-vh-100"
        x-data="paymentApp()" x-init="init()"
    >

        <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
            <div 
                class="alert alert-success text-center"
                x-show="isSuccess"
                x-transition
            >
                Payment completed!</br> Seller has 14 days to deliver an item.
            </div>

            <div 
                class="alert alert-danger text-center"
                x-show="isError"
                x-transition
            >
                Payment failed!</br> Please try again in the app.
            </div>

            <div class="text-center">
                <img src="logo.png" alt="Go Connect Marketplace Logo" class="img-fluid" style="max-height: 80px;">
            </div>
            <h3 class="text-center mb-4">Go Connect Marketplace</h3>
            <div class="d-flex justify-content-center">
                <a href="exp://192.168.8.119:8081/--/(tabs)/profile?success=true" class="btn btn-outline-primary">
                    Go back to the app
                </a>
            </div>
        </div>


    </div>
  
</body>
</html>
